services:
  postgres:
    image: postgres:16-alpine
    container_name: kspdb_postgres
    restart: always
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-kspdb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kspdb_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kspdb}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-kspdb_admin} -d ${POSTGRES_DB:-kspdb}"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: kspdb_backend
    restart: always
    environment:
      PORT: 4000
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-kspdb_admin}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-kspdb_secret_pass}
      POSTGRES_DB: ${POSTGRES_DB:-kspdb}
      DATABASE_URL: postgres://${POSTGRES_USER:-kspdb_admin}:${POSTGRES_PASSWORD:-kspdb_secret_pass}@postgres:5432/${POSTGRES_DB:-kspdb}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: kspdb_frontend
    restart: always
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:4000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  pgdata:
